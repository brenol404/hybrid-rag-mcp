name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff check + format)
        if: always()
        run: |
          pip install ruff
          ruff check . && ruff format --check .

      - name: Unit tests
        run: pytest -q

      - name: Import smoke test (MCP server registra tools sem discar para Ollama)
        run: |
          python -c "
          import asyncio
          from hybrid_rag_mcp.server import mcp
          tools = asyncio.run(mcp.list_tools())
          assert {t.name for t in tools} == {'ask', 'ingest', 'search'}, [t.name for t in tools]
          print('tools OK:', sorted(t.name for t in tools))
          "

      - name: HTTP smoke test (endpoint streamable responde sem Ollama)
        run: |
          python -m hybrid_rag_mcp --transport http --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 5
          python -c "
          import asyncio, json
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client
          async def main():
              async with streamable_http_client('http://127.0.0.1:8000/mcp') as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      names = {t.name for t in tools.tools}
                      assert names == {'ask', 'ingest', 'search'}, names
                      print('HTTP tools OK:', sorted(names))
          asyncio.run(main())
          "
          kill $SERVER_PID || true

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true

      - name: Pull embedding model
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do ollama list >/dev/null 2>&1 && break; sleep 1; done
          ollama pull bge-m3

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run retrieval eval (recall@k / nDCG@k)
        run: |
          python -m hybrid_rag_mcp.eval

      - name: Enforce minimum quality (recall@1 >= 0.8)
        run: |
          python -c "
          from hybrid_rag_mcp.eval import evaluate, load_datasets, EvalReport
          from hybrid_rag_mcp.config import get_settings
          from hybrid_rag_mcp.rag.engine import RAGEngine
          rag = RAGEngine(get_settings())
          rag.ingest('examples/corpus')
          rep = evaluate(rag, load_datasets('eval/dataset.jsonl', 'eval/dataset.real.jsonl'), (1, 3, 5))
          r1 = rep.mean_recall(1)
          print(rep)
          print('recall@1 =', round(r1, 3))
          assert r1 >= 0.8, f'recall@1 = {r1} abaixo do limite 0.8'
          "