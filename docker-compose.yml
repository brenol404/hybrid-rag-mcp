# Qdrant em modo servidor (opcional) para o hybrid-rag-mcp.
#
# O default do projeto é o Qdrant EMBARCADO (sem Docker, 1 processo por vez).
# Suba este compose para o modo SERVIDOR: índice compartilhado entre processos
# e sessões simultâneas. Depois aponte o servidor para ele:
#
#   docker compose up -d
#   QDRANT_URL=http://localhost:6333 python -m hybrid_rag_mcp
#
# O primeiro `ingest` cria a coleção no servidor; os dados persistem no volume.

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # REST + dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
