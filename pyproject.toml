[project]
name = "hybrid-rag-mcp"
version = "0.1.0"
description = "Local task-oriented agent with hybrid RAG (vector + BM25) exposed via MCP, with offline fallback through Ollama."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "lima" }]
dependencies = [
    "mcp>=1.4",
    "qdrant-client>=1.12",
    "ollama>=0.4",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
hybrid-rag-mcp = "hybrid_rag_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"