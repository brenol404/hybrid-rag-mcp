[project]
name = "hybrid-rag-mcp"
version = "0.3.0"
description = "Local task-oriented agent with hybrid RAG (vector + BM25) exposed via MCP, with offline fallback through Ollama."
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "Breno Lima", email = "pqpbrenol@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "rag",
    "hybrid-search",
    "bm25",
    "qdrant",
    "ollama",
    "cohere",
    "llm",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp>=1.4",
    "qdrant-client>=1.12",
    "ollama>=0.4",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pypdf>=5.0",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/brenol404/hybrid-rag-mcp"
Documentation = "https://github.com/brenol404/hybrid-rag-mcp#readme"
Repository = "https://github.com/brenol404/hybrid-rag-mcp.git"
Issues = "https://github.com/brenol404/hybrid-rag-mcp/issues"
Changelog = "https://github.com/brenol404/hybrid-rag-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.0",
]

[project.scripts]
hybrid-rag-mcp = "hybrid_rag_mcp.server:main"
hybrid-rag-ui = "hybrid_rag_mcp.ui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]